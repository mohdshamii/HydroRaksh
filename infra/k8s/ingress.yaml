apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jalsuraksha-ingress
  namespace: jalsuraksha
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "jalsuraksha-api-service"
spec:
  tls:
    - hosts:
        - jalsuraksha.gov.in
      secretName: jalsuraksha-tls
  rules:
    - host: jalsuraksha.gov.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: jalsuraksha-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jalsuraksha-web-service
                port:
                  number: 3000
