apiVersion: apps/v1
kind: Deployment
metadata:
  name: jalsuraksha-api
  namespace: jalsuraksha
  labels:
    app: jalsuraksha-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jalsuraksha-api
  template:
    metadata:
      labels:
        app: jalsuraksha-api
    spec:
      containers:
        - name: api
          image: ghcr.io/mohdshamii/jalsuraksha-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jalsuraksha-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: jalsuraksha-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jalsuraksha-secrets
                  key: secret-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: jalsuraksha-api-service
  namespace: jalsuraksha
spec:
  type: ClusterIP
  selector:
    app: jalsuraksha-api
  ports:
    - port: 8000
      targetPort: 8000
