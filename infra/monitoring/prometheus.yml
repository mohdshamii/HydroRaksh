global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "jalsuraksha-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "jalsuraksha-ingestion"
    static_configs:
      - targets: ["ingestion:9100"]

  - job_name: "timescaledb"
    static_configs:
      - targets: ["timescaledb:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:9121"]
