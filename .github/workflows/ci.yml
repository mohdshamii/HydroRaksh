name: JalSuraksha CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend API & Services (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: jalsuraksha
          POSTGRES_PASSWORD: jalsuraksha_secure_dev_pass
          POSTGRES_DB: jalsuraksha_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r services/ingestion/requirements.txt
          pip install -r services/ml/requirements.txt
          pip install pytest pytest-cov flake8 httpx

      - name: Lint with Flake8
        run: |
          flake8 apps/api services/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql://jalsuraksha:jalsuraksha_secure_dev_pass@localhost:5432/jalsuraksha_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-pipeline-min-32-chars
          ENVIRONMENT: test
        run: |
          PYTHONPATH=. pytest tests/ -v --cov=apps/api --cov=services/ingestion --cov=services/ml --cov-report=term-missing

  frontend-build:
    name: Frontend Client (Next.js 15 + Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Type Check & Lint
        working-directory: apps/web
        run: npm run lint || true

      - name: Build Next.js Production Bundle
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws/stream

  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Validate Compose Config
        run: docker compose -f infra/docker-compose.yml config
