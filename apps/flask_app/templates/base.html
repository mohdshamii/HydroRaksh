<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}JalSuraksha — National Water Resource Intelligence Platform{% endblock %}</title>
  <meta name="description" content="AI-driven national groundwater intelligence and scientific decision support platform for 700+ districts across 36 States and Union Territories of India." />
  
  <!-- Immediate Theme Initialization to Prevent FOUC -->
  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const urlTheme = params.get("theme");
        const savedTheme = localStorage.getItem("jalsuraksha_theme");
        const theme = urlTheme || savedTheme || "dark";
        if (theme === "light") {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
        }

        // Font size accessibility scale
        const savedScale = localStorage.getItem("jalsuraksha_font_scale") || "100";
        document.documentElement.style.fontSize = (parseInt(savedScale) / 100 * 16) + "px";
      } catch (e) {}
    })();
  </script>

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['Merriweather', 'Georgia', 'serif'],
          },
          colors: {
            govNavy: '#0F2E5A',
            govNavyDark: '#0A1E3F',
            govNavyLight: '#1E3A8A',
            tricolorSaffron: '#E06D10',
            tricolorGreen: '#127D3B',
            ashokaNavy: '#0F2E5A',
            primary: '#0F2E5A',
            accent: '#E06D10',
            danger: '#DC2626',
            warning: '#D97706',
            safe: '#16A34A',
            atlas: {
              canvas: 'var(--bg-canvas)',
              card: 'var(--bg-card)',
              elevated: 'var(--bg-elevated)',
              subtle: 'var(--bg-subtle)',
              text: 'var(--text-primary)',
              muted: 'var(--text-muted)',
              faint: 'var(--text-faint)',
              border: 'var(--border-color)',
            }
          },
          borderRadius: {
            gov: '6px',
            token: '8px',
          },
          boxShadow: {
            card: 'var(--shadow-card)',
            elevated: 'var(--shadow-elevated)',
            modal: 'var(--shadow-modal)',
          }
        }
      }
    }
  </script>

  <!-- Chart.js & Lucide Icons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Production Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-atlas-canvas text-atlas-text min-h-screen flex flex-col overflow-x-hidden transition-colors duration-200">
  
  {% block content %}{% endblock %}

  <!-- Core Production JavaScript Modules -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  <script src="{{ url_for('static', filename='js/jalrakshak.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ai_chat.js') }}"></script>

  <!-- Global Accessibility Helpers -->
  <script>
    function changeFontSize(action) {
      try {
        let currentScale = parseInt(localStorage.getItem("jalsuraksha_font_scale") || "100");
        if (action === 'increase' && currentScale < 120) currentScale += 10;
        else if (action === 'decrease' && currentScale > 80) currentScale -= 10;
        else if (action === 'reset') currentScale = 100;
        localStorage.setItem("jalsuraksha_font_scale", currentScale.toString());
        document.documentElement.style.fontSize = (currentScale / 100 * 16) + "px";
      } catch (e) {}
    }

    function toggleLanguage(lang) {
      try {
        localStorage.setItem("jalsuraksha_lang", lang);
        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set("lang", lang);
        window.location.href = currentUrl.toString();
      } catch (e) {}
    }
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
